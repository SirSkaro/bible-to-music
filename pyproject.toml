[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-music"
version = "0.1.0"
description = "A local Scripture music production workbench"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "cosmic-ray==8.9.0",
    "import-linter==2.17",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.bible-music.verification]
minimum-kill-percent = 95

[tool.bible-music.verification.mutation-overrides]
# "src/bible_music/domain/passage_plan.py" = 96

[tool.bible-music.verification.complexity-overrides]
# "src/bible_music/app/review_take.py" = 8

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ANN", "B", "C901", "E4", "E7", "E9", "F", "I", "UP"]
extend-select = [
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007", "DTZ901",
    "ISC004",
    "PGH004",
    "PIE794", "PIE796",
    "PLE", "PLW1510",
    "PT010", "PT011", "PT012", "PT014", "PT015", "PT017", "PT028",
    "RUF008", "RUF009", "RUF012", "RUF013", "RUF032", "RUF043",
    "RUF100", "RUF101", "RUF102",
    "S101", "SLF001",
    "T100",
    "W605",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Cosmic Ray 8.9.0 mutates module-level return-type unions as binary operations.
"src/bible_music/domain/take_review.py" = ["UP045"]
# Pytest rewrites test assertions to explain failures.
"tests/**" = ["S101"]

[tool.importlinter]
root_package = "bible_music"

[[tool.importlinter.contracts]]
name = "Application and adapters depend inward"
type = "layers"
containers = ["bible_music"]
layers = ["adapters", "app", "domain"]

[[tool.importlinter.contracts]]
name = "Application views are independent of the domain"
type = "forbidden"
source_modules = ["bible_music.app.views"]
forbidden_modules = ["bible_music.domain"]

[[tool.importlinter.contracts]]
name = "Domain modules have acyclic dependencies"
type = "acyclic_siblings"
ancestors = ["bible_music.domain"]
